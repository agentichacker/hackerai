name: Publish Windows release

# Attaches the installer from a "Package Windows desktop (unsigned)" run to a GitHub release,
# once that run's Windows verification has passed. The site's download links and the app's updater
# read the latest release, so this is what makes the Windows download available.
#
#   gh workflow run publish-windows-release.yml --ref main -f source_run_id=<package run id>
#
# A tag made with the workflow token does not start release.yml, which builds and publishes every
# platform from its own run.

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Run of package-windows.yml whose verified installer is published."
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    name: Publish Windows x64
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
    steps:
      - name: Require the Windows verification
        shell: bash
        run: |
          set -euo pipefail
          workflow="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" --jq '.name')"
          if [[ "$workflow" != "Package Windows desktop (unsigned)" ]]; then
            echo "::error::Run $SOURCE_RUN_ID is '$workflow', not a Windows packaging run."
            exit 1
          fi
          conclusion="$(
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/jobs?per_page=100" \
              --jq '.jobs[] | select(.name == "Verify on Windows x64") | .conclusion'
          )"
          if [[ "$conclusion" != "success" ]]; then
            echo "::error::Run $SOURCE_RUN_ID did not pass its Windows verification (conclusion: '${conclusion}')."
            exit 1
          fi

      - name: Download the installer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-win-x64
          path: installer
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}

      - name: Verify the download
        shell: bash
        run: |
          set -euo pipefail
          cd installer
          # The packaging job listed its files under the directory it collected them in.
          sed 's#release-publish/##' SHA256SUMS.txt > checksums
          mv checksums SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      - name: Publish
        shell: bash
        run: |
          set -euo pipefail
          cd installer
          version="$(sed -nE 's/^version: "?([^"]+)"?$/\1/p' latest.yml)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::latest.yml names no release version: '$version'."
            exit 1
          fi
          tag="v$version"
          exe="HackerAI-Code-$version-x64.exe"
          test -f "$exe"
          sha="$(awk -v exe="$exe" '$2 == exe { print $1 }' SHA256SUMS.txt)"
          test "${#sha}" -eq 64
          cat > notes.md <<EOF
          Windows x64 installer for HackerAI Code.

          | File | Purpose |
          | --- | --- |
          | \`$exe\` | Installer for Windows 10 and later on x64 |
          | \`$exe.blockmap\`, \`latest.yml\` | In-app update metadata |
          | \`SHA256SUMS.txt\` | Checksums of the files above |

          SHA-256 of the installer: \`$sha\`

          Before publication, this installer was installed silently, launched, and uninstalled on
          Windows Server 2025 in GitHub Actions, and its bundled native modules were loaded there.

          Windows SmartScreen may show "Windows protected your PC" because this build is not
          code-signed yet. Choose **More info** and then **Run anyway**.
          EOF
          assets=("$exe" "$exe.blockmap" latest.yml SHA256SUMS.txt)
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber "${assets[@]}"
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --notes-file notes.md --latest
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "HackerAI Code $version" --notes-file notes.md --latest "${assets[@]}"
          fi
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json url,tagName,isDraft,isPrerelease \
            --jq '"Published \(.url) (tag \(.tagName), draft \(.isDraft), prerelease \(.isPrerelease))"'

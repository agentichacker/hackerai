name: Package Windows desktop (unsigned)

# Builds the Windows x64 NSIS installer from source without publishing a release.
# The release pipeline is gated on repository variables and signing secrets that
# this checkout does not have; this workflow only packages and uploads the
# installer so the Windows build can be exercised and inspected.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Package Windows x64
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=hackerai... --filter=@hackerai/web... --filter=@hackerai/desktop... --filter=@hackerai/scripts...
          # A filtered install that starts from the current full store adds
          # nothing worth a second copy of it.
          save-pnpm-store: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Install cargo-xwin
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-xwin@0.23.1

      - name: Build resource monitor
        run: cargo xwin build --locked --release --manifest-path native/resource-monitor/Cargo.toml --target x86_64-pc-windows-msvc

      - name: Build JS bundle
        env:
          HACKERAI_TELEMETRY_CHANNEL: dev
        run: vp run build:desktop:bundle

      - name: Package Windows installer
        env:
          HACKERAI_DESKTOP_REUSE_RESOURCE_MONITOR: true
        run: >
          vp run dist:desktop:artifact
          --platform win
          --target nsis
          --arch x64
          --skip-build
          --verbose

      - name: Upload installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hackerai-windows-x64-unsigned
          path: release/*
          if-no-files-found: error
          compression-level: 0
